[package]
name = "deepseek-harness-desktop"
version = "0.1.1"
description = "Minimal local WebView shell for DeepSeek Harness Docker"
authors = ["dps contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.6.3", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
