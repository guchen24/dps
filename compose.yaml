services:
  harness:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: dps-harness:0.1.1-rc.2
    container_name: dps-harness
    env_file:
      - .env
    environment:
      DSH_HOME: /home/node/.dsh
      DSH_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --expose-internals
    ports:
      - "127.0.0.1:${DSH_PORT:-3080}:3080"
    volumes:
      - dps-dsh-home:/home/node/.dsh
      - ${DSH_WORKSPACE:-.}:/workspace
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    shm_size: 1gb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:3080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

volumes:
  dps-dsh-home:
    name: dps-dsh-home
